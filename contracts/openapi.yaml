openapi: 3.1.0
info: {title: Virtualization + AI 501 qualification adapter, version: 1.0.0}
paths:
  /api/v1/qualifications:
    post:
      summary: Evaluate and record a multi-VM inference fleet qualification
      requestBody: {required: true, content: {application/json: {schema: {$ref: ./qualification-request.schema.json}}}}
      responses: {"200": {description: Deterministic qualification result}, "400": {description: Contract refused}}
  /api/v1/qualifications/{request_id}:
    get:
      summary: Read durable evidence for one qualification
      parameters: [{in: path, name: request_id, required: true, schema: {type: string}}]
      responses: {"200": {description: Evidence records}, "404": {description: Request not found}}
  /metrics:
    get: {summary: Read qualification decision and ledger counts, responses: {"200": {description: Prometheus text}}}
  /healthz:
    get: {summary: Read adapter mode and ledger status, responses: {"200": {description: Health state}}}
