apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: virtualization-ai-501-evidence
  labels: {{- include "virtualization-ai-501.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.qualificationAdapter.ledger.storageClassName }}
  storageClassName: {{ .Values.qualificationAdapter.ledger.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.qualificationAdapter.ledger.size }}
