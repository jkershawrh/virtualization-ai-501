apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: virtualization-ai-501-evidence
  labels: {{- include "virtualization-ai-501.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if (default .Values.qualificationAdapter.ledger.storageClassName .Values.storage_class) }}
  storageClassName: {{ default .Values.qualificationAdapter.ledger.storageClassName .Values.storage_class | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.qualificationAdapter.ledger.size }}
