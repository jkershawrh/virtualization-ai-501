apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtualization-ai-501-qualification-adapter
  labels:
    app.kubernetes.io/name: virtualization-ai-501-qualification-adapter
    {{- include "virtualization-ai-501.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.qualificationAdapter.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: virtualization-ai-501-qualification-adapter}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtualization-ai-501-qualification-adapter
        {{- include "virtualization-ai-501.labels" . | nindent 8 }}
    spec:
      serviceAccountName: virtualization-ai-501
      automountServiceAccountToken: false
      nodeSelector: {{- toYaml .Values.qualificationAdapter.placement.nodeSelector | nindent 8 }}
      # OpenShift SCC assigns the namespace-valid UID/GID range.
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: qualification-adapter
          image: {{ default (include "virtualization-ai-501.image" .Values.qualificationAdapter.image) .Values.workload_image | quote }}
          imagePullPolicy: {{ .Values.qualificationAdapter.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: ADAPTER_MODE, value: {{ .Values.qualificationAdapter.mode | quote }}}
            - {name: LEDGER_PATH, value: /var/lib/virtualization-ai-501/evidence.jsonl}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            {{- if .Values.qualificationAdapter.inference.secretName }}
            - {name: INFERENCE_ENDPOINT, valueFrom: {secretKeyRef: {name: {{ .Values.qualificationAdapter.inference.secretName | quote }}, key: {{ .Values.qualificationAdapter.inference.endpointKey | quote }}}}}
            - {name: INFERENCE_API_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.qualificationAdapter.inference.secretName | quote }}, key: {{ .Values.qualificationAdapter.inference.apiKeyKey | quote }}}}}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {{- toYaml .Values.qualificationAdapter.resources | nindent 12 }}
          volumeMounts: [{name: evidence-ledger, mountPath: /var/lib/virtualization-ai-501}]
      volumes: [{name: evidence-ledger, persistentVolumeClaim: {claimName: virtualization-ai-501-evidence}}]
---
apiVersion: v1
kind: Service
metadata:
  name: virtualization-ai-501-qualification-adapter
  labels:
    app.kubernetes.io/name: virtualization-ai-501-qualification-adapter
    {{- include "virtualization-ai-501.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: virtualization-ai-501-qualification-adapter}
  ports: [{name: http, port: 8080, targetPort: http}]
