{{- if .Values.fleet.enabled }}
{{- range $index, $name := .Values.fleet.members }}
{{- if $index }}
---
{{- end }}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: virtualization-ai-501-vm
    fleet.redhat-intel.com/member: {{ $name }}
    {{- include "virtualization-ai-501.labels" $ | nindent 4 }}
spec:
  runStrategy: {{ $.Values.fleet.runStrategy }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: virtualization-ai-501-vm, fleet.redhat-intel.com/member: {{ $name }}}
    spec:
      serviceAccountName: vm-qualification-client
      nodeSelector: {{- toYaml $.Values.fleet.placement.nodeSelector | nindent 8 }}
      domain:
        devices:
          disks: [{name: rootdisk, disk: {bus: virtio}}, {name: cloudinit, disk: {bus: virtio}}]
          interfaces: [{name: default, masquerade: {}}]
        resources: {{- toYaml $.Values.fleet.resources | nindent 10 }}
      networks: [{name: default, pod: {}}]
      volumes:
        - name: rootdisk
          containerDisk: {image: {{ include "virtualization-ai-501.image" $.Values.fleet.containerDisk | quote }}}
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: learner
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  {{- if $.Values.fleet.sshAuthorizedKey }}
                  ssh_authorized_keys: [{{ $.Values.fleet.sshAuthorizedKey | quote }}]
                  {{- end }}
              write_files:
                - path: /home/learner/vm_client.py.b64
                  owner: learner:learner
                  permissions: '0600'
                  content: {{ $.Files.Get "files/vm_client.py" | b64enc | quote }}
              runcmd:
                - [sh, -c, "base64 -d /home/learner/vm_client.py.b64 > /home/learner/vm_client.py"]
                - [chown, learner:learner, /home/learner/vm_client.py]
                - [chmod, '0755', /home/learner/vm_client.py]
{{- end }}
{{- end }}
