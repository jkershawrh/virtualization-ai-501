worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  # OpenShift assigns an arbitrary non-root UID and this image runs with a
  # read-only root filesystem. Keep every Nginx runtime write under /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /fonts/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /logos/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
