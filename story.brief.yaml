schema_version: demo-story.redhat-intel.com/story-brief/v1
title: "Qualify the fleet, not the happy path"
audience: "Virtualization, AI platform, performance, and lab operations teams."
desired_outcome: "Show how multi-VM inference becomes a bounded, repeatable, human-reviewed qualification case."
duration_minutes: 7
source_state: REHEARSAL
assumptions:
  - No live OpenShift, KubeVirt, migration, Intel CPU placement, inference execution, or telemetry was observed in the factory session.
  - Quantitative fixtures demonstrate the contract and UI only; they are not production performance claims.
beats:
  - {id: ordinary_world, claim: "One healthy VM does not qualify a fleet."}
  - {id: stakes, claim: "Migration success can hide inference, placement, containment, and evidence failure."}
  - {id: root_cause, claim: "Fleet truth depends on correlated identities across every changed condition."}
  - {id: reframe, claim: "Treat scale as a declared envelope tested through baseline, migration, and disruption."}
  - {id: system_reveal, claim: "Collectors, policy, evidence, and human authority remain separate."}
  - {id: live_proof, claim: "Run pass, breach, and incomplete-evidence conditions through one adapter."}
  - {id: trials, claim: "Policy distinguishes ALLOW_REVIEW, REFUSE, and ABSTAIN."}
  - {id: payoff, claim: "The factory produces an immutable candidate, never a certification."}
  - {id: next_journey, claim: "Continue into a separate 75–90 minute Showroom lab."}
evidence_ledger:
  - {claim: "Fleet trial behavior", classification: rehearsal-fixture, owner: factory, source: contracts/examples, last_verified: "2026-09-28", treatment: "Always display REHEARSAL."}
  - {claim: "LIVE OpenShift Virtualization and Intel placement", classification: future-state, owner: Launchpad, source: destination-required, last_verified: null, treatment: "Never claim until directly observed."}
  - {claim: "No automatic promotion", classification: verified-fact, owner: factory, source: contracts/qualification-policy.json, last_verified: "2026-09-28", treatment: "Keep authority boundary visible."}
speaker_prompts:
  - "Name the declared envelope before revealing any measurement."
  - "Call out REHEARSAL on every fallback result."
  - "Separate Intel placement evidence from inference execution evidence."
  - "Close presentation before the lab handoff."
