sources:
  prerequisite: {repository: https://github.com/jkershawrh/virtualization-ai-501, revision: 0672f307bf48eae2803958e290997d8c046b5c42}
intent:
  primary_user: virtualization and AI platform qualification engineer
  workload: multi-VM clients executing inference through a shared governed service
  recognized_problem: single-workload operation evidence does not establish fleet capacity, disruption behavior, placement, or repeatability
  audience_decision: whether an immutable candidate has enough evidence for human-controlled Launchpad intake
  desired_outcome: one reviewable fleet qualification record without granting certification or promotion authority
story:
  business_outcome: Bound fleet scale and failure risk before offering a lab for independent certification.
  audience: [virtualization_administrator, ai_platform_owner, performance_engineer, lab_operator]
  tension: VM migration can appear successful while inference SLOs, CPU dependencies, containment, or evidence continuity fail.
architecture:
  actors:
    - {id: reviewer, name: Human reviewer, kind: authority, responsibility: declares envelope and owns promotion, status: verified, source: contracts/qualification-policy.json}
  runtime_objects:
    - {id: vm-fleet, name: KubeVirt VM fleet, kind: VirtualMachine/VMI, responsibility: generate concurrent inference traffic, status: verified, source: charts/virtualization-ai-501/templates/vm.yaml}
    - {id: adapter, name: Qualification adapter, kind: Deployment/Service, responsibility: evaluates supplied evidence and appends ledger records, status: verified, source: workload/app.py}
    - {id: ledger, name: Evidence ledger, kind: PersistentVolumeClaim, responsibility: preserves the correlated qualification journey, status: verified, source: charts/virtualization-ai-501/templates/persistentvolumeclaim.yaml}
  boundaries:
    - {id: namespace, name: Participant namespace, kind: trust, responsibility: contains candidate resources and NetworkPolicy, status: verified, source: charts/virtualization-ai-501/templates/networkpolicy.yaml}
    - {id: promotion, name: Human promotion boundary, kind: authority, responsibility: prevents factory certification or promotion, status: verified, source: contracts/qualification-policy.json}
  external_dependencies:
    - {id: openshift, name: OpenShift Virtualization, kind: platform, responsibility: supplies live VM and migration state when directly observed, status: unknown, source: destination-required}
    - {id: inference, name: Inference service, kind: service, responsibility: returns directly observed execution evidence, status: unknown, source: runtime-secret-reference}
  flows:
    - id: fleet-qualification
      name: Fleet qualification evidence path
      kind: evidence
      trigger: human declares a qualification envelope and submits current observations
      outcome: deterministic ALLOW_REVIEW, REFUSE, or ABSTAIN plus durable evidence
      edges:
        - {from: reviewer, to: vm-fleet, purpose: declare fleet and trial envelope, protocol: qualification-request/v1, evidence_ids: [declared-envelope]}
        - {from: vm-fleet, to: inference, purpose: execute baseline migration and disruption trials, protocol: HTTPS, evidence_ids: [trial-results]}
        - {from: inference, to: adapter, purpose: correlate execution placement and telemetry, protocol: qualification-request/v1, evidence_ids: [correlated-telemetry]}
        - {from: adapter, to: ledger, purpose: append digest-bearing decisions, protocol: JSONL, evidence_ids: [qualification-ledger]}
        - {from: ledger, to: reviewer, purpose: request human promotion review, protocol: qualification-response/v1, evidence_ids: [handoff-recommendation]}
operational_pattern:
  name: DISCOVER → BASELINE → MIGRATE → DISRUPT → CORRELATE → QUALIFY → HANDOFF
  rationale: Fleet qualification must establish identity and a baseline before changed-condition trials can support a promotion review.
  steps:
    - {id: DISCOVER, label: DISCOVER, question: "Is the declared fleet directly observed?", flow_ids: [fleet-qualification], evidence_ids: [declared-envelope]}
    - {id: BASELINE, label: BASELINE, question: "Does normal load fit the envelope?", flow_ids: [fleet-qualification], evidence_ids: [trial-results]}
    - {id: MIGRATE, label: MIGRATE, question: "Does inference and state survive placement change?", flow_ids: [fleet-qualification], evidence_ids: [trial-results]}
    - {id: DISRUPT, label: DISRUPT, question: "Is failure contained inside the declared boundary?", flow_ids: [fleet-qualification], evidence_ids: [trial-results]}
    - {id: CORRELATE, label: CORRELATE, question: "Are request VM CPU event and telemetry identities continuous?", flow_ids: [fleet-qualification], evidence_ids: [correlated-telemetry]}
    - {id: QUALIFY, label: QUALIFY, question: "Does deterministic policy allow human review?", flow_ids: [fleet-qualification], evidence_ids: [qualification-ledger], decision_id: qualification-policy}
    - {id: HANDOFF, label: HANDOFF, question: "Is the immutable evidence package complete?", flow_ids: [fleet-qualification], evidence_ids: [handoff-recommendation]}
  changed_condition: migration and bounded disruption at the declared concurrency
  close: immutable factory candidate with every Launchpad authority false
evidence:
  - {id: declared-envelope, name: SLO capacity concurrency and CPU boundaries, source: qualification request, collection: human-authored before trials, supports: evaluation criteria existed before measurements, status: verified}
  - {id: trial-results, name: baseline migration and disruption results, source: current adapter request, collection: external collectors, supports: observed scale and changed-condition behavior, status: verified}
  - {id: correlated-telemetry, name: VM placement CPU inference and continuity graph, source: evidence snapshot, collection: current session only, supports: identity and continuity claims, status: verified}
  - {id: qualification-ledger, name: durable seven-state ledger, source: qualification adapter, collection: append and fsync, supports: restart continuity, status: verified}
  - {id: handoff-recommendation, name: nonpromoting factory receipt, source: handoff manifest, collection: release workflow, supports: independent Launchpad intake only, status: verified}
decisions:
  - {id: qualification-policy, owner: deterministic policy with human review, policy: ALLOW_REVIEW only when all trials remain inside the declared envelope, fail_closed_behavior: REFUSE known breaches and ABSTAIN on incomplete correlation or continuity, status: verified}
authority:
  human_promotion_required: true
  automated_remediation: false
  llm_may_execute: false
  factory_may_certify: false
  factory_may_promote: false
ai_assessment:
  needed: false
  kind: rules
  rationale: deterministic comparisons fully produce the qualification recommendation
  tasks: []
  inputs: []
  outputs: []
  model_identity_source: null
  hardware_identity_source: direct current-session CPU placement evidence only
  evidence_access: []
  action_authority: none
  validation: [contract tests, policy tests, journey evidence]
  fallback: deterministic policy remains available; no LLM fallback exists
  final_decision_owner: human reviewer
runtime:
  architecture: linux/amd64
  deployment_scope: participant_namespace
  egress_default: deny
  exact_digest_images_required: true
  release_gate: zero_high_zero_critical
  source_states: [LIVE, REHEARSAL, OFFLINE]
story_mapping:
  audience_question: Has this fleet earned independent certification work?
  stakes: [unbounded concurrency, hidden placement dependency, lost state continuity, uncontained failure]
  architecture_flow_ids: [fleet-qualification]
  live_proof_flow_ids: [fleet-qualification]
  comparison: envelope satisfied versus known breach versus incomplete evidence
  payoff: immutable evidence-backed candidate for human review
  next_journey: separate 75–90 minute Showroom lab
